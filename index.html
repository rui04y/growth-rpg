<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1>⚔️ Growth RPG ⚔️</h1>

    <div class="status">

        <h2 id="playerName">勇者</h2>

        <p>Lv <span id="level">1</span></p>

        <p>HP <span id="hp">100</span> / <span id="maxHp">100</span></p>

<div class="bar">
    <div id="hpBar" class="hpBar"></div>
</div>

<p>EXP <span id="exp">0</span> / <span id="nextExp">100</span></p>

<div class="bar">
    <div id="expBar" class="expBar"></div>
</div>

        <p>攻撃 <span id="atk">10</span></p>

        <p>防御 <span id="def">5</span></p>

        <p>所持金 <span id="gold">100</span> G</p>

        <p>
         魔石：<span id="magicStone">0</span>
        </p>

        <p>武器 <span id="weapon">なし</span></p>
        
        <p>防具 <span id="armor">なし</span></p>

    </div>

    <div class="buttons">

        <button onclick="openTrainingMenu()">🏋️ 訓練</button>

        <button onclick="location.href='dungeon.html'">
        🗺️ ダンジョン
        </button>

        <button onclick="heal()">❤️ 回復</button>

        <button onclick="openMenu()">📊 メニュー</button>

    
      

    </div>


    <div id="trainingMenu" class="screen" style="display:none;">

    <h2>🏋️ 訓練</h2>

    <button onclick="train('atk')">
        ⚔️ 攻撃訓練
    </button>

    <button onclick="train('def')">
        🛡️ 防御訓練
    </button>

    <button onclick="train('hp')">
        ❤️ 体力訓練
    </button>

    <button onclick="train('mp')">
        ✨ 魔力訓練
    </button>

    <button onclick="closeTrainingMenu()">
        戻る
    </button>

    </div>

    
    <div class="log">

        <h3>ログ</h3>

        <p id="log">ゲーム開始！</p>

    </div>
<div id="battle" class="battle" style="display:none;">
    <h2 id="enemyName">スライム</h2>

    <p>
        HP
        <span id="enemyHp">20</span> /
        <span id="enemyMaxHp">20</span>
    </p>
<p>MP <span id="mp">20</span> / <span id="maxMp">20</span></p>

<div class="bar">
    <div id="mpBar" class="mpBar"></div>
</div>
    <div class="bar">
        <div id="enemyHpBar" class="hpBar"></div>
    </div>

    <button onclick="attack()">⚔️ 攻撃</button>
    <button onclick="defend()">🛡️ 防御</button>
    <button onclick="openSkillMenu()">✨ スキル</button>
<div id="skillMenu" style="display:none;">

    <h3>✨ スキル選択</h3>

    <div id="skillList"></div>

    <button onclick="closeSkillMenu()">
        戻る
    </button>

</div>



    <button onclick="useItem()">🎒 アイテム</button>
    <button onclick="runAway()">🏃 逃げる</button>
</div>


<div id="menuScreen" class="screen" style="display:none;">

    <h2>📊 メニュー</h2>

    <div class="menuButtons">

        <button onclick="location.href='status.html'">📈 ステータス</button>

        <button onclick="location.href='inventory.html'">🎒 インベントリ</button>

        <button onclick="location.href='equipment.html'">⚔️ 装備</button>

        <button onclick="location.href='smithy.html'">🔨 鍛冶屋</button>

        <button onclick="location.href='title.html'">🏆 称号</button>

        <button onclick="location.href='gacha.html'">🎰 ガチャ</button>

        <button onclick="location.href='shop.html'">🏪 ショップ</button>

        <button onclick="saveGame()">💾 セーブ</button>

        <button onclick="loadGame()">📂 ロード</button>

    </div>

    <button onclick="closeMenu()">戻る</button>

</div>

<div id="titleScreen" class="screen" style="display:none;">

    <h2>🏆 称号</h2>

    <p>
        現在の称号：
        <span id="equippedTitle">なし</span>
    </p>

    <div id="titleList"></div>

    <button onclick="closeTitleMenu()">戻る</button>

</div>




<div id="shopScreen" class="screen" style="display:none;">

    <h2>🏪 ショップ</h2>

    <p>💰 所持金：<span id="shopGold">0</span> G</p>

    <div class="shopTabs">

        <button onclick="showShopCategory('item')">
            🧪 アイテム
        </button>

        <button onclick="showShopCategory('weapon')">
            ⚔️ 武器
        </button>

        <button onclick="showShopCategory('armor')">
            🛡️ 防具
        </button>

    </div>

    <div id="shopList"></div>

    <button onclick="closeShop()">戻る</button>

</div>







<script src="script.js"></script>
<script src="skill.js"></script>
<script src="smithy.js"></script>

<script>
loadGame();
playTownBGM();
</script>

<button onclick="testGold()">テスト：1000000G</button>
<button onclick="testForestBoss()">🧪 森の王テスト</button>
<button onclick="resetTestData()">⚠️ テスト用データリセット</button>


</body>

</html>
